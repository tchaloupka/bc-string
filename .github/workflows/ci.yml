# documentation.
name: ci

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: tests
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
        dc: [dmd-latest, ldc-latest]
        exclude:
          # macOS runners are arm64; dmd has no arm64 build
          - { os: macOS-latest, dc: dmd-latest }
        include:
          - { os: ubuntu-latest, dc: dmd-2.102.2, arch: x86_64, dip1000: false }
          - { os: ubuntu-latest, dc: dmd-2.094.2, arch: x86_64, dip1000: false }
          - { os: ubuntu-latest, dc: ldc-1.24.0, arch: x86_64, dip1000: false }
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v3
    - name: Install D compiler
      uses: dlang-community/setup-dlang@v1
      with:
          compiler: ${{ matrix.dc }}
    - name: Run tests
      env:
        DIP1000: ${{ matrix.dip1000 }}
      run: scripts/ci.sh
    - name: Upload codecov
      if: matrix.os == 'ubuntu-latest' && matrix.dc == 'dmd-latest'
      env:
        COVERAGE: true
      run: scripts/ci.sh
